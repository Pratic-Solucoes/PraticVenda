<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gestão - Créditos</title>
<link rel="icon" type="image/png" href="/static/images/logo.png"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="/static/css/styleLayout.css"><link rel="stylesheet" href="/static/css/app.css?v=3">
</head><body><div id="app-wrapper">{{template "sidebar" .}}<div id="main-content"><div id="topbar"><div class="topbar-title">Gestão Vendas</div></div><div id="page-content">
<div class="d-flex align-items-center justify-content-between mb-4"><h2 class="fs-4 m-0">Contas a Receber</h2><div><button class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#modalCategoriaCredito"><i class="bi bi-tags"></i> Categoria de crédito</button><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalContaReceber"><i class="bi bi-plus-circle"></i> Novo crédito</button></div></div>
<div class="card shadow-sm border-0 rounded-4 mb-4"><div class="card-body p-4"><form class="row g-3 align-items-end" id="formFiltroCreditos"><div class="col-md-4"><label class="form-label">Cliente</label><input id="filtro_cliente" class="form-control" placeholder="Nome ou ID do cliente"></div><div class="col-md-3"><label class="form-label">Vencimento</label><input id="filtro_vencimento" type="date" class="form-control"></div><div class="col-md-3"><label class="form-label">Status</label><select id="filtro_status" class="form-select"><option value="">Todos</option><option value="PENDENTE">Pendente</option><option value="PAGO_PARCIAL">Pago parcialmente</option><option value="PAGO">Pago</option></select></div><div class="col-md-2"><button class="btn btn-outline-secondary w-100">Filtrar</button></div></form></div></div>
<div class="card shadow-sm border-0 rounded-4"><div class="card-body p-0"><div class="table-responsive"><table class="table table-sm table-hover align-middle mb-0 text-center"><thead class="table-light"><tr><th>ID</th><th class="text-start">Cliente</th><th class="text-start">Descrição</th><th>Parcela</th><th>Vencimento</th><th>Saldo inicial</th><th>Saldo restante</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabela_creditos"><tr><td colspan="9" class="py-5 text-muted">Carregando...</td></tr></tbody></table></div><div class="p-3 text-end fw-bold">Total a receber: <span id="total_creditos">R$ 0,00</span></div></div></div>
</div></div></div>{{template "modalContaReceber" .}}{{template "modalCategoriaCredito" .}}{{template "modalReceberConta" .}}<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="/static/js/contas_receber/main.js"></script></body></html>
