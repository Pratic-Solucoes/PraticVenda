<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Gestão - Administrativo</title>
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Painel administrativo</h1>
                <p class="text-muted mb-0">Organizações e usuários cadastrados.</p>
            </div>
            <button id="sairBtn" class="btn btn-outline-secondary"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
        </div>
        <p id="erro" class="alert alert-danger d-none" role="alert"></p>
        <div class="row g-4">
            <section class="col-12 col-lg-6">
                <div class="card shadow-sm h-100"><div class="card-body">
                    <h2 class="h5 mb-3">Organizações</h2>
                    <div class="table-responsive"><table class="table table-sm align-middle mb-0">
                        <thead><tr><th>Nome</th><th>E-mail</th><th>Schema</th><th>Status</th></tr></thead>
                        <tbody id="organizacoes"><tr><td colspan="4" class="text-muted">Carregando...</td></tr></tbody>
                    </table></div>
                </div></div>
            </section>
            <section class="col-12 col-lg-6">
                <div class="card shadow-sm h-100"><div class="card-body">
                    <h2 class="h5 mb-3">Usuários</h2>
                    <div class="table-responsive"><table class="table table-sm align-middle mb-0">
                        <thead><tr><th>Nome</th><th>E-mail</th><th>Organização</th><th>Status</th></tr></thead>
                        <tbody id="usuarios"><tr><td colspan="4" class="text-muted">Carregando...</td></tr></tbody>
                    </table></div>
                </div></div>
            </section>
        </div>
    </main>
    <script type="module" src="/static/js/administrativo.js"></script>
</body>
</html>
