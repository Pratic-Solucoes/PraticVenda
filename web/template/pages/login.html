<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="icon" type="image/png" href="/static/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="/static/css/components/login_content.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão - Login</title>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-left">
            <!-- Caso a imagem seja muito grande, usamos um max-width ou deixamos o css controlar -->
            <img src="/static/images/logo.png" alt="Logo" class="login-logo-img">
            <h2 class="login-brand-title">Pratic Gestão</h2>
            <p class="login-brand-subtitle">CRM para software house</p>
        </div>
        <div class="login-right">
            <div class="login-right-content">
                <h3 class="login-title">Bem-vindo de volta</h3>
                <p class="login-subtitle">Informe suas credenciais para continuar</p>
                
                {{template "loginForm" .}}
                
                <div class="login-footer">
                    Pratic Gestão © 2026
                </div>
            </div>
        </div>
    </div>

    {{template "toastContainer" .}}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <script type="module" src="/static/js/login.js?v=admin-login-2"></script>
</body>

</html>
