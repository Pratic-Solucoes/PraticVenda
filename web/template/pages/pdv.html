<!doctype html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/static/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Nossos CSS Customizados -->
    <link rel="stylesheet" href="/static/css/styleLayout.css" />
    <link rel="stylesheet" href="/static/css/app.css?v=2" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão - Ponto de Venda</title>
    <style>
        .pdv-container {
            height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }

        .table-container {
            flex-grow: 1;
            overflow-y: auto;
            min-height: 200px;
        }

        .total-display {
            font-size: 3rem;
            font-weight: 800;
            background-color: #f8f9fa;
            border: 3px solid #198754;
            border-radius: 0.75rem;
            padding: 10px 30px;
            color: #198754;
            text-align: right;
            min-width: 250px;
        }

        .pdv-actions .btn {
            padding: 12px 20px;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div id="app-wrapper">
        <!-- Sidebar via Template -->
        {{template "sidebar" .}}

        <!-- Page Content -->
        <div id="main-content">
            <!-- Topbar -->
            <div id="topbar">
                <div class="topbar-title">Gestão Vendas</div>

                <div class="topbar-notif-wrap ms-auto">
                    <div class="topbar-notif">
                        <i class="bi bi-bell"></i>
                        <span class="badge-notif">2</span>
                    </div>
                </div>

                <div class="topbar-user-wrap">
                    <i class="bi bi-person-circle topbar-user-icon"></i>
                    <span class="topbar-user-name">TESTE</span>
                    <i class="bi bi-chevron-down topbar-user-chevron"></i>
                </div>
            </div>

            <div id="page-content">
                <div class="d-flex align-items-center mb-3">
                    <h2 class="fs-4 m-0 text-dark"><i class="bi bi-cart4 text-primary me-2"></i>Ponto de Venda (PDV)
                    </h2>
                </div>
                <div class="card shadow-sm border-0 rounded-4 pdv-container">
                    <div class="card-body p-4 d-flex flex-column">

                        <!-- Primeira Linha: Cliente -->
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label for="pdv_cliente" class="form-label text-muted fw-bold">Cliente</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i
                                            class="bi bi-person fs-5"></i></span>
                                    <input type="text" class="form-control form-control-lg border-start-0 ps-0"
                                        id="pdv_cliente"
                                        placeholder="Buscar cliente por nome, CPF ou CNPJ (Opcional)" />
                                </div>
                            </div>
                        </div>

                        <!-- Segunda Linha: Produto -->
                        <div class="row mb-4">
                            <div class="col-md-12">
                                <label for="pdv_produto" class="form-label text-muted fw-bold">Produto</label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-primary text-white border-primary"><i
                                            class="bi bi-upc-scan fs-5"></i></span>
                                    <input type="text" class="form-control form-control-lg border-primary"
                                        id="pdv_produto"
                                        placeholder="Digite o código de barras ou nome do produto..." />
                                    <button class="btn btn-primary px-4 fw-bold fs-5" type="button"
                                        id="btn_adicionar_produto">
                                        <i class="bi bi-plus-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Tabela de Produtos -->
                        <div class="table-responsive table-container border rounded-3 mb-4 shadow-sm">
                            <table class="table table-hover align-middle mb-0 text-center">
                                <thead class="table-light sticky-top shadow-sm">
                                    <tr>
                                        <th>Item</th>
                                        <th>Código</th>
                                        <th class="text-start">Nome do Produto</th>
                                        <th style="width: 150px;">Quantidade</th>
                                        <th>Valor Unit. (R$)</th>
                                        <th>Subtotal (R$)</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabela_pdv_body">
                                    <!-- Placeholder para quando estiver vazio -->
                                    <tr>
                                        <td colspan="7" class="text-muted py-5 text-center fs-5">
                                            <i class="bi bi-bag-x fs-1 d-block mb-3 text-secondary"></i>
                                            Nenhum produto adicionado à venda.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Rodapé: Total e Botões -->
                        <div class="row align-items-center mt-auto pt-3 border-top">
                            <div class="col-xl-7 col-lg-12 mb-3 mb-xl-0 d-flex gap-2 pdv-actions flex-wrap">
                                <button class="btn btn-success fw-bold text-uppercase flex-grow-1">
                                    <i class="bi bi-cash-coin me-1 fs-5"></i> Pagamento
                                </button>
                                <button class="btn btn-warning fw-bold text-dark text-uppercase">
                                    <i class="bi bi-floppy me-1 fs-5"></i> Salvar em Aberto
                                </button>
                                <button class="btn btn-secondary fw-bold text-uppercase">
                                    <i class="bi bi-printer me-1 fs-5"></i> Imprimir
                                </button>
                                <button class="btn btn-danger fw-bold text-uppercase">
                                    <i class="bi bi-x-circle me-1 fs-5"></i> Cancelar
                                </button>
                            </div>
                            <div
                                class="col-xl-5 col-lg-12 d-flex justify-content-xl-end justify-content-center align-items-center">
                                <div class="text-muted fw-bold fs-4 me-3 text-uppercase">Total:</div>
                                <div class="total-display shadow-sm">R$ 0,00</div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modais -->
    {{template "toastContainer" .}}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Para a próxima etapa: adicionar script para lógica do PDV -->
    <!-- <script type="module" src="/static/js/pdv/main.js"></script> -->
</body>

</html>
