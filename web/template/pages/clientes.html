<!doctype html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/static/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/static/css/styleLayout.css" />
    <link rel="stylesheet" href="/static/css/app.css?v=2" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão - Clientes</title>
</head>

<body>
    <div id="app-wrapper">
        {{template "sidebar" .}}

        <div id="main-content">
            <!-- Topbar -->
            <div id="topbar">
                <div class="topbar-title">Gestão Vendas</div>

                <div class="topbar-notif-wrap ms-auto">
                    <div class="topbar-notif">
                        <i class="bi bi-bell"></i>
                        <span class="badge-notif">2</span>
                    </div>
                </div>

                <div class="topbar-user-wrap">
                    <i class="bi bi-person-circle topbar-user-icon"></i>
                    <span class="topbar-user-name">TESTE</span>
                    <i class="bi bi-chevron-down topbar-user-chevron"></i>
                </div>
            </div>

            <div id="page-content">

                <!-- Cabeçalho da Seção -->
                <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-person-badge-fill me-2 fs-5" style="color: #d97706;"></i>
                    <h4 class="m-0 fw-bold" style="color: var(--brand-dark-blue); font-size: 1.1rem;">Clientes</h4>
                </div>

                <!-- Painel de Cadastro/Edição Inline -->
                <div class="collapse mb-4" id="collapseFormCliente">
                    <div class="card shadow-sm border-0 rounded-4 border-start border-primary border-4">
                        <div
                            class="card-header bg-white border-0 pt-4 pb-0 px-4 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 text-primary fw-bold" id="formClienteTitulo">
                                <i class="bi bi-truck me-2"></i> Novo Cliente
                            </h5>
                            <button type="button" class="btn-close" aria-label="Close"
                                id="btnFecharFormCliente"></button>
                        </div>
                        <div class="card-body p-4">
                            <input type="hidden" id="edit_cliente_id" />

                            <!-- Tabs do Formulário -->
                            <ul class="nav nav-tabs mb-3" id="editClienteTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active fw-bold" id="edit-basico-tab" data-bs-toggle="tab"
                                        data-bs-target="#edit-basico" type="button" role="tab"
                                        aria-selected="true">Dados Básicos</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link fw-bold" id="edit-enderecos-tab" data-bs-toggle="tab"
                                        data-bs-target="#edit-enderecos" type="button" role="tab"
                                        aria-selected="false">Endereços</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link fw-bold" id="edit-telefones-tab" data-bs-toggle="tab"
                                        data-bs-target="#edit-telefones" type="button" role="tab"
                                        aria-selected="false">Telefones</button>
                                </li>
                            </ul>

                            <div class="tab-content" id="editClienteTabsContent">
                                <!-- Dados Básicos -->
                                <div class="tab-pane fade show active" id="edit-basico" role="tabpanel">
                                    <form id="formEditarCliente">
                                        <div class="row g-2">
                                            <div class="col-md-8">
                                                <label for="edit_cliente_nome"
                                                    class="form-label form-label-sm fw-semibold mb-1">Nome *</label>
                                                <input type="text" class="form-control form-control-sm"
                                                    id="edit_cliente_nome" required />
                                            </div>
                                            <div class="col-md-4">
                                                <label for="edit_cliente_tipo"
                                                    class="form-label form-label-sm fw-semibold mb-1">Tipo *</label>
                                                <select class="form-select form-select-sm" id="edit_cliente_tipo"
                                                    required>
                                                    <option value="PF">Pessoa Física</option>
                                                    <option value="PJ">Pessoa Jurídica</option>
                                                </select>
                                            </div>
                                            <div class="col-md-6">
                                                <label for="edit_cliente_cpf_cnpj"
                                                    class="form-label form-label-sm fw-semibold mb-1">CPF/CNPJ *</label>
                                                <input type="text" class="form-control form-control-sm"
                                                    id="edit_cliente_cpf_cnpj" required />
                                            </div>
                                            <div class="col-md-6">
                                                <label for="edit_cliente_ie"
                                                    class="form-label form-label-sm fw-semibold mb-1">Inscrição
                                                    Estadual</label>
                                                <input type="text" class="form-control form-control-sm"
                                                    id="edit_cliente_ie" />
                                            </div>
                                            <div class="col-md-6">
                                                <label for="edit_cliente_email"
                                                    class="form-label form-label-sm fw-semibold mb-1">E-mail de Contato
                                                    *</label>
                                                <input type="email" class="form-control form-control-sm"
                                                    id="edit_cliente_email" required />
                                            </div>
                                            <div class="col-md-6">
                                                <label for="edit_cliente_contribuinte"
                                                    class="form-label form-label-sm fw-semibold mb-1">Indicador de
                                                    Contribuinte</label>
                                                <select class="form-select form-select-sm"
                                                    id="edit_cliente_contribuinte">
                                                    <option value="1">Contribuinte ICMS</option>
                                                    <option value="2">Contribuinte Isento</option>
                                                    <option value="9">Não Contribuinte</option>
                                                </select>
                                            </div>
                                            <div class="col-md-6 d-flex align-items-end pb-2">
                                                <div class="form-check form-switch">
                                                    <input class="form-check-input" type="checkbox"
                                                        id="edit_cliente_is_consumidor_final" />
                                                    <label class="form-check-label fw-semibold"
                                                        for="edit_cliente_is_consumidor_final">Consumidor Final</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mt-4 text-end border-top pt-3">
                                            <button type="button" class="btn btn-light me-2"
                                                id="btnCancelarCliente">Cancelar</button>
                                            <button type="submit" class="btn btn-success px-4 fw-bold">Salvar
                                                Dados</button>
                                        </div>
                                    </form>
                                </div>

                                <!-- Endereços -->
                                <div class="tab-pane fade" id="edit-enderecos" role="tabpanel">
                                    <div class="d-flex justify-content-end mb-3">
                                        <button type="button" class="btn btn-outline-primary btn-sm fw-bold"
                                            id="btnNovoEndereco">
                                            <i class="bi bi-plus-circle me-1"></i> Novo Endereço
                                        </button>
                                    </div>
                                    <div id="containerEnderecosCliente"></div>
                                </div>

                                <!-- Telefones -->
                                <div class="tab-pane fade" id="edit-telefones" role="tabpanel">
                                    <div class="d-flex justify-content-end mb-3">
                                        <button type="button" class="btn btn-outline-primary btn-sm fw-bold"
                                            id="btnNovoTelefone">
                                            <i class="bi bi-plus-circle me-1"></i> Novo Telefone
                                        </button>
                                    </div>
                                    <div id="containerTelefonesCliente"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bloco Principal -->
                <div class="card shadow-sm border-0 rounded-3 mb-4">
                    <div class="card-body p-4">
                        <!-- Barra de Pesquisa e Ações -->
                        <div class="row g-3 align-items-end mb-4">
                            <div class="col-md-8">
                                <label for="filtro_busca" class="form-label text-muted fw-bold mb-1"
                                    style="font-size: 0.9rem;">Pesquisar</label>
                                <input type="text" class="form-control" id="filtro_busca"
                                    placeholder="Pesquisar por nome..." />
                            </div>
                            <div class="col-md-4 d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-success fw-bold text-white px-3"
                                    id="btnNovoCliente"
                                    style="background-color: #2e7d32; border:none; font-size: 0.9rem;">
                                    + Novo Cliente
                                </button>
                                <button type="button" class="btn btn-secondary fw-bold px-3 text-white"
                                    id="btnFecharPesquisa"
                                    style="background-color: #6c757d; border:none; font-size: 0.9rem;">
                                    <i class="bi bi-x"></i> Fechar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabela de Clientes -->
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-premium mb-0 text-center" id="tabela_clientes">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th class="text-start">Nome</th>
                                        <th>E-mail</th>
                                        <th>Telefone</th>
                                        <th>Tipo</th>
                                        <th>CPF/CNPJ</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabela_clientes_body">
                                    <tr>
                                        <td colspan="7" class="text-muted py-5 text-center" id="loading_resultados">
                                            Carregando...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Templates para Itens (Endereço e Telefone) -->
    <template id="template-endereco-item">
        <div class="card mb-2 border shadow-sm">
            <div class="card-body py-2">
                <p class="mb-1"><strong class="logradouro"></strong>, <span class="numero"></span></p>
                <p class="mb-0 text-muted small"><span class="bairro"></span> - <span class="municipio"></span>/<span
                        class="uf"></span> - CEP: <span class="cep"></span></p>
            </div>
            <div class="card-footer bg-transparent border-0 text-end pt-0 pb-2">
                <button type="button" class="btn btn-outline-primary btn-sm btn-editar-endereco"><i
                        class="bi bi-pencil"></i> Editar</button>
            </div>
        </div>
    </template>
    <template id="template-telefone-item">
        <div class="card mb-2 border shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center py-2">
                <p class="mb-0 fw-semibold">(<span class="ddd"></span>) <span class="numero"></span></p>
                <button type="button" class="btn btn-outline-primary btn-sm btn-editar-telefone"><i
                        class="bi bi-pencil"></i> Editar</button>
            </div>
        </div>
    </template>

    <!-- Sub-modais de Endereço e Telefone -->
    <div class="modal fade" id="modalEnderecoCliente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow">
                <form id="formEnderecoCliente">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">Dados do Endereço</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="endereco_id" />
                        <div class="row g-2">
                            <div class="col-md-3"><label for="end_cep"
                                    class="form-label form-label-sm fw-semibold mb-1">CEP *</label><input type="text"
                                    class="form-control form-control-sm" id="end_cep" required /></div>
                            <div class="col-md-9"><label for="end_logradouro"
                                    class="form-label form-label-sm fw-semibold mb-1">Logradouro *</label><input
                                    type="text" class="form-control form-control-sm" id="end_logradouro" required />
                            </div>
                            <div class="col-md-3"><label for="end_numero"
                                    class="form-label form-label-sm fw-semibold mb-1">Número *</label><input type="text"
                                    class="form-control form-control-sm" id="end_numero" required /></div>
                            <div class="col-md-4"><label for="end_bairro"
                                    class="form-label form-label-sm fw-semibold mb-1">Bairro *</label><input type="text"
                                    class="form-control form-control-sm" id="end_bairro" required /></div>
                            <div class="col-md-5"><label for="end_municipio"
                                    class="form-label form-label-sm fw-semibold mb-1">Município *</label><input
                                    type="text" class="form-control form-control-sm" id="end_municipio" required />
                            </div>
                            <div class="col-md-2"><label for="end_uf"
                                    class="form-label form-label-sm fw-semibold mb-1">UF *</label><input type="text"
                                    class="form-control form-control-sm" id="end_uf" required /></div>
                            <div class="col-md-4"><label for="end_codigo_municipio"
                                    class="form-label form-label-sm fw-semibold mb-1">Cód. Município</label><input
                                    type="text" class="form-control form-control-sm" id="end_codigo_municipio" /></div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">Salvar Endereço</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modalTelefoneCliente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <form id="formTelefoneCliente">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">Dados do Telefone</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="telefone_id" />
                        <div class="row g-2">
                            <div class="col-md-4"><label for="tel_ddd"
                                    class="form-label form-label-sm fw-semibold mb-1">DDD *</label><input type="text"
                                    class="form-control form-control-sm" id="tel_ddd" required /></div>
                            <div class="col-md-8"><label for="tel_numero"
                                    class="form-label form-label-sm fw-semibold mb-1">Número *</label><input type="text"
                                    class="form-control form-control-sm" id="tel_numero" required /></div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">Salvar Telefone</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    {{template "errorModal" .}}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script type="module" src="/static/js/clientes/main.js"></script>
</body>

</html>
