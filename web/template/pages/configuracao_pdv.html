<!DOCTYPE html>
<html lang="pt-BR"><head>
<link rel="icon" type="image/png" href="/static/images/logo.png"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="/static/css/styleLayout.css"><link rel="stylesheet" href="/static/css/app.css?v=3"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gestão - Configuração de PDV</title>
</head><body><div id="app-wrapper">{{template "sidebar" .}}<div id="main-content"><div id="topbar"><div class="topbar-title">Gestão Vendas</div><div class="topbar-notif-wrap ms-auto"><div class="topbar-notif"><i class="bi bi-bell"></i><span class="badge-notif">2</span></div></div><div class="topbar-user-wrap"><i class="bi bi-person-circle topbar-user-icon"></i><span class="topbar-user-name">TESTE</span><i class="bi bi-chevron-down topbar-user-chevron"></i></div></div><div id="page-content">
<div class="d-flex align-items-center mb-4"><h2 class="fs-4 m-0 text-dark"><i class="bi bi-cart4 text-primary me-2"></i>Configuração de PDV</h2></div>
<form id="formConfiguracaoPDV"><div class="row g-4"><div class="col-lg-6"><div class="card shadow-sm border-0 rounded-4 h-100"><div class="card-header bg-white py-3 border-0"><h5 class="mb-0 fw-bold">Operação e financeiro</h5></div><div class="card-body p-4"><div class="mb-3"><label class="form-label">Estoque padrão *</label><select id="pdv_estoque" class="form-select" required></select><div class="form-text">Estoque utilizado nas vendas do PDV.</div></div><div class="mb-3"><label class="form-label">Categoria de crédito das vendas *</label><select id="pdv_categoria_credito" class="form-select" required></select><div class="form-text">Usada no movimento financeiro de cada venda.</div></div><div class="mb-3"><label class="form-label d-block">Formas de pagamento liberadas *</label><div id="pdv_formas_pagamento" class="border rounded p-3"></div></div><div><label class="form-label d-block">Condições de pagamento liberadas *</label><div id="pdv_condicoes_pagamento" class="border rounded p-3"></div></div></div></div></div>
<div class="col-lg-6"><div class="card shadow-sm border-0 rounded-4 h-100"><div class="card-header bg-white py-3 border-0"><h5 class="mb-0 fw-bold">Regras de venda</h5></div><div class="card-body p-4"><div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="pdv_exigir_cliente_prazo"><label class="form-check-label" for="pdv_exigir_cliente_prazo">Exigir cliente nas vendas parceladas/a prazo</label></div><div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="pdv_permitir_desconto"><label class="form-check-label" for="pdv_permitir_desconto">Permitir desconto manual</label></div><div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="pdv_permitir_alterar_preco"><label class="form-check-label" for="pdv_permitir_alterar_preco">Permitir alteração de preço dos itens</label></div><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="pdv_gerar_financeiro_recebido" checked><label class="form-check-label" for="pdv_gerar_financeiro_recebido">Vendas concluídas geram financeiro já recebido</label><div class="form-text">Desmarcado: gera conta a receber e exige cliente cadastrado.</div></div></div></div></div></div><div class="text-end mt-4"><button class="btn btn-primary fw-bold px-4" type="submit"><i class="bi bi-check-lg me-1"></i>Salvar configurações</button></div></form>
</div></div></div>{{template "toastContainer" .}}<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="/static/js/configuracao_pdv/main.js"></script></body></html>
