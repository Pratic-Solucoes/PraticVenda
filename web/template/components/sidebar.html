{{define "sidebar"}}
<div class="sidebar d-flex" id="wrapper">
    <div id="sidebar-wrapper">
        <!-- Espaço para Logo -->
        <div class="sidebar-logo-container">
            <!-- Usuário vai colocar a tag img com src da logo aqui -->
            <img src="" alt="P" class="sidebar-logo-placeholder" id="sidebarLogo" />
        </div>

        <div class="list-group list-group-flush w-100">
            <!-- Dashboard -->
            <a href="/dashboard" class="list-group-item" title="Dashboard" data-bs-toggle="tooltip" data-bs-placement="right">
                <i class="bi bi-speedometer2"></i>
            </a>

            <!-- PDV -->
            <a href="/pdv" class="list-group-item text-primary" title="PDV" data-bs-toggle="tooltip" data-bs-placement="right">
                <i class="bi bi-cart4"></i>
            </a>

            <!-- Financeiro (Abre Submenu) -->
            <a href="#" class="list-group-item submenu-toggle" data-target="financeiroMenu" title="Financeiro" data-bs-toggle="tooltip" data-bs-placement="right">
                <i class="bi bi-bank"></i>
            </a>

            <!-- Cadastros (Abre Submenu) -->
            <a href="#" class="list-group-item submenu-toggle" data-target="cadastrosMenu" title="Cadastros" data-bs-toggle="tooltip" data-bs-placement="right">
                <i class="bi bi-card-list"></i>
            </a>

            <!-- Categorias (Abre Submenu) -->
            <a href="#" class="list-group-item submenu-toggle" data-target="categoriasMenu" title="Categorias" data-bs-toggle="tooltip" data-bs-placement="right">
                <i class="bi bi-tags"></i>
            </a>

            <!-- Configurações (Abre Submenu) -->
            <a href="#" class="list-group-item submenu-toggle" data-target="configuracoesMenu" title="Configurações" data-bs-toggle="tooltip" data-bs-placement="right">
                <i class="bi bi-gear"></i>
            </a>

            <div class="mt-auto w-100 pb-4">
                <!-- Sair -->
                <a href="/logout" class="list-group-item text-danger" title="Sair" data-bs-toggle="tooltip" data-bs-placement="right">
                    <i class="bi bi-box-arrow-left"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Submenus Flyout (Escondidos por padrão) -->
    <!-- Financeiro -->
    <div class="sidebar-submenu" id="financeiroMenu">
        <div class="sidebar-submenu-header">
            <span>Financeiro</span>
            <i class="bi bi-x-lg submenu-close" style="cursor:pointer"></i>
        </div>
        <div class="list-group list-group-flush">
            <a href="/contas-pagar" class="list-group-item"><i class="bi bi-cash-coin"></i> Contas a Pagar</a>
            <a href="#" class="list-group-item"><i class="bi bi-graph-up-arrow"></i> Contas a Receber</a>
            <a href="/formas-pagamento" class="list-group-item"><i class="bi bi-credit-card"></i> Formas de Pagamento</a>
        </div>
    </div>

    <!-- Cadastros -->
    <div class="sidebar-submenu" id="cadastrosMenu">
        <div class="sidebar-submenu-header">
            <span>Cadastros</span>
            <i class="bi bi-x-lg submenu-close" style="cursor:pointer"></i>
        </div>
        <div class="list-group list-group-flush">
            <a href="/clientes" class="list-group-item"><i class="bi bi-people"></i> Clientes</a>
            <a href="/fornecedores" class="list-group-item"><i class="bi bi-truck"></i> Fornecedores</a>
            <a href="#" class="list-group-item"><i class="bi bi-box"></i> Produtos</a>
        </div>
    </div>

    <!-- Categorias -->
    <div class="sidebar-submenu" id="categoriasMenu">
        <div class="sidebar-submenu-header">
            <span>Categorias</span>
            <i class="bi bi-x-lg submenu-close" style="cursor:pointer"></i>
        </div>
        <div class="list-group list-group-flush">
            <a href="/categorias-contas-pagar" class="list-group-item"><i class="bi bi-cash-coin"></i> Categorias de Débitos</a>
            <a href="#" class="list-group-item"><i class="bi bi-graph-up-arrow"></i> Categorias de Crédito</a>
        </div>
    </div>

    <!-- Configurações -->
    <div class="sidebar-submenu" id="configuracoesMenu">
        <div class="sidebar-submenu-header">
            <span>Configurações</span>
            <i class="bi bi-x-lg submenu-close" style="cursor:pointer"></i>
        </div>
        <div class="list-group list-group-flush">
            <a href="/configuracao-usuario" class="list-group-item"><i class="bi bi-gear"></i> Configuração do Usuário</a>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Inicializa Tooltips
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });

        const toggles = document.querySelectorAll('.submenu-toggle');
        const submenus = document.querySelectorAll('.sidebar-submenu');
        const closes = document.querySelectorAll('.submenu-close');

        // Esconder todos submenus
        function hideAllSubmenus() {
            submenus.forEach(menu => menu.classList.remove('show'));
        }

        toggles.forEach(toggle => {
            toggle.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('data-target');
                const targetMenu = document.getElementById(targetId);
                
                // Se já estiver aberto, fecha
                if (targetMenu.classList.contains('show')) {
                    targetMenu.classList.remove('show');
                } else {
                    // Esconde outros e abre este
                    hideAllSubmenus();
                    targetMenu.classList.add('show');
                }
            });
        });

        closes.forEach(btn => {
            btn.addEventListener('click', function() {
                hideAllSubmenus();
            });
        });

        // Fechar submenu se clicar fora dele e da sidebar
        document.addEventListener('click', function(event) {
            const wrapper = document.getElementById('wrapper');
            if (!wrapper.contains(event.target)) {
                hideAllSubmenus();
            }
        });
    });
</script>
{{end}}
