{{define "modalPagarConta"}}
<!-- Modal Pagar Conta -->
<div class="modal fade" id="modalPagarConta" tabindex="-1" aria-labelledby="modalPagarContaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalPagarContaLabel">Realizar Pagamento</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formPagarConta">
          <input type="hidden" id="pagar_conta_id">
          
          <div class="mb-3">
            <label class="form-label text-muted fw-bold">Saldo Restante Atual</label>
            <input type="text" class="form-control bg-light" id="pagar_saldo_restante" disabled>
          </div>
          
          <div class="mb-3">
            <label for="pagar_valor" class="form-label text-success fw-bold">Valor a Pagar (R$) *</label>
            <input type="number" step="0.01" min="0.01" class="form-control border-success" id="pagar_valor" placeholder="0.00" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" form="formPagarConta" class="btn btn-success"><i class="bi bi-check-circle me-1"></i> Confirmar Pagamento</button>
      </div>
    </div>
  </div>
</div>
{{end}}
