{{define "modalFinanceiroEntrada"}}
<!-- Modal: Gerar Financeiro a partir de Entrada de Estoque -->
<div class="modal fade" id="modalFinanceiroEntrada" tabindex="-1" aria-labelledby="modalFinanceiroEntradaLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="modalFinanceiroEntradaLabel">
          <i class="bi bi-cash-coin me-2 text-warning"></i>Gerar Lançamento Financeiro
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-4">
          Revise os dados abaixo antes de lançar a conta a pagar. Todos os campos podem ser ajustados.
        </p>
        <form id="formFinanceiroEntrada">
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="fin_id_fornecedor" class="form-label fw-semibold">Fornecedor *</label>
              <select class="form-select" id="fin_id_fornecedor" required>
                  <option value="" disabled selected>Selecione o fornecedor...</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="fin_id_categoria" class="form-label fw-semibold">Categoria</label>
              <select class="form-select" id="fin_id_categoria">
                  <option value="">Sem Categoria (Opcional)</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="fin_descricao" class="form-label fw-semibold">Descrição *</label>
            <input type="text" class="form-control" id="fin_descricao"
                placeholder="Ex: Entrada Estoque - 13/07/2025" required>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="fin_nr_documento" class="form-label fw-semibold">Nº Documento</label>
              <input type="text" class="form-control" id="fin_nr_documento" placeholder="Número do boleto ou doc">
            </div>
            <div class="col-md-6">
              <label for="fin_nr_nota_fiscal" class="form-label fw-semibold">Nº Nota Fiscal</label>
              <input type="text" class="form-control" id="fin_nr_nota_fiscal" placeholder="Série e número da NFe">
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <label for="fin_valor" class="form-label fw-semibold">Valor (R$) *</label>
              <input type="number" step="0.01" class="form-control fw-bold" id="fin_valor" placeholder="0.00" required>
            </div>
            <div class="col-md-4">
              <label for="fin_dt_entrada" class="form-label fw-semibold">Data de Entrada *</label>
              <input type="date" class="form-control" id="fin_dt_entrada" required>
            </div>
            <div class="col-md-4">
              <label for="fin_dt_vencimento" class="form-label fw-semibold">Data de Vencimento *</label>
              <input type="date" class="form-control" id="fin_dt_vencimento" required>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="fin_nr_parcela" class="form-label fw-semibold">Nº Parcela *</label>
              <input type="number" class="form-control" id="fin_nr_parcela" value="1" min="1" required>
            </div>
            <div class="col-md-6">
              <label for="fin_nr_total_parcelas" class="form-label fw-semibold">Total de Parcelas *</label>
              <input type="number" class="form-control" id="fin_nr_total_parcelas" value="1" min="1" required>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" form="formFinanceiroEntrada" class="btn btn-warning fw-bold text-dark">
          <i class="bi bi-cash-coin me-1"></i> Lançar Financeiro
        </button>
      </div>
    </div>
  </div>
</div>
{{end}}
