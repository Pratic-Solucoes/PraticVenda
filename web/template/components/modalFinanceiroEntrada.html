{{define "modalFinanceiroEntrada"}}
<!-- Modal: Gerar Financeiro a partir de Entrada de Estoque -->
<div class="modal fade" id="modalFinanceiroEntrada" tabindex="-1" aria-labelledby="modalFinanceiroEntradaLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="modalFinanceiroEntradaLabel">
          <i class="bi bi-cash-coin me-2 text-warning"></i>Gerar Lançamento Financeiro
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-4">
          O valor total é o mesmo da entrada e não pode ser alterado. Informe os vencimentos e valores das parcelas conforme recebido do fornecedor.
        </p>
        <form id="formFinanceiroEntrada">
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="fin_id_fornecedor" class="form-label fw-semibold">Fornecedor *</label>
              <select class="form-select" id="fin_id_fornecedor" required>
                  <option value="" disabled selected>Selecione o fornecedor...</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="fin_id_categoria" class="form-label fw-semibold">Categoria *</label>
              <select class="form-select" id="fin_id_categoria" required>
                  <option value="">Selecione a categoria...</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="fin_descricao" class="form-label fw-semibold">Descrição *</label>
            <input type="text" class="form-control" id="fin_descricao"
                placeholder="Ex: Entrada Estoque - 13/07/2025" required>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="fin_nr_documento" class="form-label fw-semibold">Nº Documento</label>
              <input type="text" class="form-control" id="fin_nr_documento" placeholder="Número do boleto ou doc">
            </div>
            <div class="col-md-6">
              <label for="fin_nr_nota_fiscal" class="form-label fw-semibold">Nº Nota Fiscal</label>
              <input type="text" class="form-control" id="fin_nr_nota_fiscal" placeholder="Série e número da NFe">
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <label for="fin_valor" class="form-label fw-semibold">Total da entrada (R$)</label>
              <input type="number" step="0.01" class="form-control fw-bold" id="fin_valor" readonly>
            </div>
            <div class="col-md-4">
              <label for="fin_dt_entrada" class="form-label fw-semibold">Data de Entrada *</label>
              <input type="date" class="form-control" id="fin_dt_entrada" required>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2"><label class="form-label fw-semibold mb-0">Parcelas *</label><button type="button" class="btn btn-sm btn-outline-primary" id="btnAdicionarParcela"><i class="bi bi-plus-lg"></i> Adicionar parcela</button></div>
          <div class="w-100 overflow-hidden"><table class="table table-sm align-middle w-100 mb-0" style="table-layout: fixed;"><thead><tr><th style="width: 16%;">Parcela</th><th style="width: 35%;">Vencimento</th><th class="text-end" style="width: 35%;">Valor (R$)</th><th style="width: 14%;"></th></tr></thead><tbody id="finParcelasBody"></tbody><tfoot><tr><th colspan="2" class="text-end">Total das parcelas</th><th class="text-end" id="finTotalParcelas">R$ 0,00</th><th></th></tr><tr><td colspan="4" class="small text-muted text-wrap" id="finDiferencaParcelas"></td></tr></tfoot></table></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" form="formFinanceiroEntrada" class="btn btn-warning fw-bold text-dark">
          <i class="bi bi-cash-coin me-1"></i> Lançar Financeiro
        </button>
      </div>
    </div>
  </div>
</div>
{{end}}
